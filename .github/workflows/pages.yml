name: Publish EmbodiedStudio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Restore frozen models and verify their hashes
        shell: bash
        run: |
          set -euo pipefail
          for archive in models/media/corpus/*.glb.gz; do
            name=$(basename "$archive" .gz)
            gzip -dc "$archive" > "site/media/corpus/$name"
          done
          cd site
          sha256sum --check ../models.sha256
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
